name: Spark

options:
  # TODO: Change to your own reverse-DNS prefix (also update PRODUCT_BUNDLE_IDENTIFIER below).
  bundleIdPrefix: com.tesseraga
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.3.0"
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.9.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.13.0"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "6.0.0"

targets:
  Spark:
    type: application
    platform: macOS
    sources:
      - path: Spark
    dependencies:
      - package: KeyboardShortcuts
      - package: Markdown
        product: Markdown
      - package: SwiftSoup
      - package: Yams
    info:
      path: Spark/Resources/Info.plist
      properties:
        CFBundleDisplayName: Spark
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        # Allow plain-HTTP connections to local servers (Ollama on localhost / .local hosts).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: Spark/Resources/Spark.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Importing provider configs (opencode, DeepSeek Harness, 9router) from files the user picks.
        com.apple.security.files.user-selected.read-only: true
        # Settings persist in the real ~/.config/spark/config.json (ConfigFile), outside the container.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.config/spark/
    settings:
      base:
        # TODO: Change to your own bundle identifier.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.spark
        PRODUCT_NAME: Spark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Spark:
    build:
      targets:
        Spark: all
    run:
      config: Debug
    archive:
      config: Release

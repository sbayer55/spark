name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans only the commits in this push/PR; fails on verified or unknown-status secrets.
      - uses: trufflesecurity/trufflehog@v3.97.6
        with:
          extra_args: --results=verified,unknown

  build:
    name: Build (Debug & Release)
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Spark.xcodeproj \
            -scheme Spark \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # The project allows no warnings (see CLAUDE.md). Package targets build with
      # warnings suppressed, so any compiler/build-system warning left is ours.
      # (SWIFT_TREAT_WARNINGS_AS_ERRORS can't be set globally: it conflicts with the
      # packages' -suppress-warnings.)
      - name: Fail on warnings
        run: |
          if grep -E '^(/[^:]+:[0-9]+:[0-9]+: )?warning: ' build.log | sort -u | tee warnings.txt | grep -q .; then
            while IFS= read -r line; do
              echo "::warning::${line}"
            done < warnings.txt
            echo "::error::Build produced $(wc -l < warnings.txt | tr -d ' ') warning(s)."
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.configuration }}
          path: build.log

  # Every merge to main replaces the rolling `latest-main` prerelease with a fresh DMG.
  # Versioned releases still come from `v*` tags (release.yml).
  dmg:
    name: Publish latest-main DMG
    needs: [secrets, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and just
        run: brew install xcodegen just

      # Ad-hoc signed and not notarized, like the tagged releases.
      - name: Build DMG
        run: just dmg

      - name: Checksum
        run: |
          cd build
          shasum -a 256 Spark-*.dmg | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Spark-dmg
          path: |
            build/Spark-*.dmg
            build/SHA256SUMS.txt

      - name: Publish latest-main prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main \
            build/Spark-*.dmg build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Spark latest main (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} on main. Ad-hoc signed and not notarized: on first launch, right-click Spark and choose Open."
